<!doctype html>
<html lang="tr" data-theme="dark">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="assets/css/style.css?v=11">

  <script>
    // Apply saved/system language & theme before first paint (no flash).
    (function () {
      var d = document.documentElement;
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      var l = get('lang') || ((navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en');
      var t = get('theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      d.lang = l === 'en' ? 'en' : 'tr';
      d.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      var a = get('accent');
      if (a && a !== 'aurora') d.setAttribute('data-accent', a);
      var seen = null;
      try { seen = sessionStorage.getItem('introSeen'); } catch (e) {}
      if (!seen && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) d.classList.add('intro');
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#about">Skip to content</a>
  <div class="bg-grid" id="bgGrid" aria-hidden="true"><div class="bg-lit" id="bgLit"><i></i></div></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- ============ INTRO ============ -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-row"><span>Yunus Emre Kahraman</span><span>Portfolio</span></div>
    <svg class="loader-route" viewBox="0 0 240 90">
      <path class="lr-ghost" d="M14 70 L58 26 L104 56 L150 18 L192 48 L226 22"/>
      <path class="lr-draw" d="M14 70 L58 26 L104 56 L150 18 L192 48 L226 22" pathLength="1"/>
      <circle cx="14" cy="70" r="4"/><circle cx="58" cy="26" r="4"/><circle cx="104" cy="56" r="4"/>
      <circle cx="150" cy="18" r="4"/><circle cx="192" cy="48" r="4"/><circle cx="226" cy="22" r="4"/>
    </svg>
    <div class="loader-row loader-bottom">
      <span class="loader-text" data-i18n="ui.loading"></span>
      <span class="loader-count"><b id="loaderCount">000</b></span>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><span></span></div>
  <div class="cursor-ring out" aria-hidden="true"></div>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <a href="#top" class="logo" aria-label="Yunus Emre Kahraman">
      <span class="logo-mark">YEK</span><span class="logo-dot"></span>
    </a>

    <nav class="nav-links" id="navLinks" aria-label="Primary">
      <a href="#about" data-i18n="nav.about">About</a>
      <a href="#experience" data-i18n="nav.experience">Experience</a>
      <a href="#projects" data-i18n="nav.projects">Projects</a>
      <a href="#skills" data-i18n="nav.skills">Skills</a>
      <a href="#education" data-i18n="nav.education">Education</a>
      <a href="#contact" data-i18n="nav.contact">Contact</a>
    </nav>

    <div class="nav-actions">
      <button class="search-btn" id="openPalette" type="button" data-i18n-aria="ui.search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-label" data-i18n="ui.search">Search</span>
        <kbd class="kbd-key"></kbd>
      </button>

      <div class="lang-switch" role="group" data-i18n-aria="ui.lang">
        <span class="lang-pill" aria-hidden="true"></span>
        <button type="button" data-lang="tr" aria-label="Türkçe">TR</button>
        <button type="button" data-lang="en" aria-label="English">EN</button>
      </div>

      <button class="icon-btn" id="accentToggle" type="button" data-i18n-aria="ui.accent">
        <span class="swatch" aria-hidden="true"></span>
      </button>

      <button class="icon-btn" id="themeToggle" type="button" data-i18n-aria="ui.theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>

      <button class="icon-btn burger" id="burger" type="button" aria-expanded="false" aria-controls="navLinks" data-i18n-aria="ui.menu">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- ============ HERO ============ -->
    <section class="hero" id="hero">
      <div class="vrp-wrap" aria-hidden="true"><canvas id="vrpStatic"></canvas><canvas id="vrp"></canvas></div>
      <div class="hero-glow" aria-hidden="true"><i></i><i></i><i></i></div>

      <div class="container hero-content">
        <div class="status-badge h-in" style="--d:.05s">
          <span class="pulse" aria-hidden="true"></span>
          <span data-i18n="hero.status"></span>
        </div>

        <p class="hello h-in" style="--d:.12s" data-i18n="hero.hello"></p>

        <h1 class="hero-name">
          <span class="line"><span id="nameFirst">Yunus Emre</span></span>
          <span class="line serif"><span>Kahraman</span></span>
        </h1>

        <p class="hero-role h-in" style="--d:.55s">
          <span data-i18n="hero.rolePrefix"></span>
          <span class="role" id="role"></span><span class="caret" aria-hidden="true"></span>
        </p>

        <p class="hero-tagline h-in" style="--d:.65s" data-i18n="hero.tagline"></p>

        <div class="hero-ctas h-in" style="--d:.75s">
          <a href="#projects" class="btn btn-primary" data-magnetic>
            <span data-i18n="hero.ctaProjects"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
          <a href="#contact" class="btn btn-ghost" data-magnetic>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span data-i18n="hero.ctaContact"></span>
          </a>
        </div>

        <div class="hero-meta h-in" style="--d:.85s">
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg><span data-i18n="ui.konya"></span></span>
          <span class="sep" aria-hidden="true"></span>
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="localTime">--:--</span> GMT+3</span>
        </div>
      </div>

      <aside class="hud h-in" id="hud" style="--d:1s" aria-label="VRP demo">
        <div class="hud-head">
          <span class="pulse" aria-hidden="true"></span>
          <span data-i18n="hero.hud.title"></span>
          <span class="hud-algo">road graph · 2-opt</span>
        </div>
        <div class="hud-grid">
          <div><b id="hudStops">0</b><span data-i18n="hero.hud.stops"></span></div>
          <div><b id="hudKm">0</b><span data-i18n="hero.hud.km"></span></div>
          <div>
            <div class="hud-veh">
              <button type="button" id="vehMinus" aria-label="−">−</button>
              <b id="hudVeh">4</b>
              <button type="button" id="vehPlus" aria-label="+">+</button>
            </div>
            <span data-i18n="hero.hud.vehicles"></span>
          </div>
        </div>
        <div class="hud-foot">
          <span data-i18n="hero.hud.hint"></span>
          <button type="button" id="vrpReset" data-i18n="hero.hud.reset"></button>
        </div>
      </aside>

      <a href="#about" class="scroll-cue h-in" style="--d:1.1s"><span data-i18n="hero.scroll"></span><i aria-hidden="true"></i></a>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="section" id="about">
      <div class="container">
        <header class="section-head reveal"><span class="section-index">01</span><span class="section-label" data-i18n="about.label"></span><span class="section-rule"></span></header>
        <div class="about-grid">
          <div>
            <h2 class="section-title split reveal" data-i18n="about.title" data-split></h2>
            <div class="about-body reveal" id="aboutBody" style="--d:.1s"></div>
          </div>
          <div class="terminal card spotlight reveal" id="terminal" style="--d:.15s">
            <div class="term-bar"><i></i><i></i><i></i><span>~/yunus — zsh</span></div>
            <div class="term-body" id="termBody" aria-live="off"></div>
          </div>
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </section>

    <!-- ============ EXPERIENCE ============ -->
    <section class="section" id="experience">
      <div class="container">
        <header class="section-head reveal"><span class="section-index">02</span><span class="section-label" data-i18n="experience.label"></span><span class="section-rule"></span></header>
        <h2 class="section-title split reveal" data-i18n="experience.title" data-split></h2>
        <div class="timeline" id="expList"></div>
      </div>
    </section>

    <!-- ============ PROJECTS ============ -->
    <section class="section" id="projects">
      <div class="container">
        <header class="section-head reveal"><span class="section-index">03</span><span class="section-label" data-i18n="projects.label"></span><span class="section-rule"></span></header>
        <h2 class="section-title split reveal" data-i18n="projects.title" data-split></h2>
        <div class="projects-grid" id="projectGrid"></div>
      </div>
    </section>

    <!-- ============ SKILLS ============ -->
    <section class="section" id="skills">
      <div class="container">
        <header class="section-head reveal"><span class="section-index">04</span><span class="section-label" data-i18n="skills.label"></span><span class="section-rule"></span></header>

        <div class="skills-grid" id="skillGrid"></div>
      </div>
      <div class="marquee reveal" id="marquee" aria-hidden="true"></div>
    </section>

    <!-- ============ EDUCATION ============ -->
    <section class="section" id="education">
      <div class="container">
        <header class="section-head reveal"><span class="section-index">05</span><span class="section-label" data-i18n="education.label"></span><span class="section-rule"></span></header>
        <h2 class="section-title split reveal" data-i18n="education.title" data-split></h2>
        <div class="edu-grid" id="eduGrid"></div>
      </div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="section contact" id="contact">
      <div class="contact-glow" aria-hidden="true"></div>
      <div class="container">
        <header class="section-head reveal"><span class="section-index">06</span><span class="section-label" data-i18n="contact.label"></span><span class="section-rule"></span></header>
        <h2 class="contact-title reveal">
          <span data-i18n="contact.line1"></span>
          <em class="serif" data-i18n="contact.line2"></em>
        </h2>
        <p class="contact-body reveal" style="--d:.1s" data-i18n="contact.body"></p>

        <div class="email-row reveal" style="--d:.15s">
          <a class="email-link" id="emailLink" href="#"></a>
          <button class="icon-btn copy-btn" id="copyEmail" type="button" data-i18n-aria="ui.copy">

            <svg class="i-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>
          </button>
        </div>

        <div class="socials reveal" style="--d:.2s">
          <a class="social" id="ghLink" href="#" target="_blank" rel="noopener" data-magnetic>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
            GitHub
          </a>
          <a class="social" id="liLink" href="#" target="_blank" rel="noopener" data-magnetic>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6ZM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
            LinkedIn
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wordmark" id="wordmark" aria-hidden="true">
      <span class="wm-outline">Yunus Emre Kahraman</span>
      <span class="wm-fill">Yunus Emre Kahraman</span>
    </div>
    <div class="container footer-inner">
      <p>© <span id="year"></span> · <span data-i18n="footer.built"></span></p>
      <p class="footer-hint" data-i18n-html="footer.hint"></p>
      <a href="#top" class="icon-btn" data-i18n-aria="ui.backTop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </a>
    </div>
  </footer>

  <!-- ============ COMMAND PALETTE ============ -->
  <div class="palette" id="palette" hidden>
    <div class="palette-backdrop" data-close></div>
    <div class="palette-box" role="dialog" aria-modal="true" aria-labelledby="paletteInput">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="paletteList" data-i18n-ph="ui.palettePh">
        <kbd>Esc</kbd>
      </div>
      <ul class="palette-list" id="paletteList" role="listbox"></ul>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="ui.move"></span></span>
        <span><kbd>↵</kbd> <span data-i18n="ui.select"></span></span>
        <span><kbd>Esc</kbd> <span data-i18n="ui.close"></span></span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
